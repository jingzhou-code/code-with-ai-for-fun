name: Build and Package Fudan 3D Campuses

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.check_pages.outcome == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            fudan-handan-3d/package-lock.json

      - name: Install & build Jiangwan Campus (root)
        run: |
          npm ci
          npm run build

      - name: Upload Jiangwan Campus build bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: fudan-jiangwan-3d-dist
          path: './dist'

      - name: Install & build Handan Campus (fudan-handan-3d)
        working-directory: ./fudan-handan-3d
        run: |
          npm ci
          npm run build

      - name: Upload Handan Campus build bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: fudan-handan-3d-dist
          path: './fudan-handan-3d/dist'

      - name: Bundle Handan Campus under /fudan-handan-3d for GitHub Pages
        run: |
          mkdir -p ./dist/fudan-handan-3d
          cp -r ./fudan-handan-3d/dist/* ./dist/fudan-handan-3d/

      - name: Check GitHub Pages configuration
        id: check_pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.check_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
