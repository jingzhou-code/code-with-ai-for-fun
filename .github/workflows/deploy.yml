name: Build and Package 3D Projects

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.check_pages.outcome == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            kiyomizu-dera-3d/package-lock.json
            fudan-jiangwan-3d/package-lock.json
            fudan-handan-3d/package-lock.json

      - name: Install & build Kiyomizu-dera (kiyomizu-dera-3d)
        working-directory: ./kiyomizu-dera-3d
        run: |
          npm ci
          npm run build

      - name: Install & build Fudan Jiangwan Campus (fudan-jiangwan-3d)
        working-directory: ./fudan-jiangwan-3d
        run: |
          npm ci
          npm run build

      - name: Install & build Fudan Handan Campus (fudan-handan-3d)
        working-directory: ./fudan-handan-3d
        run: |
          npm ci
          npm run build

      - name: Assemble combined Pages bundle
        run: |
          mkdir -p ./dist/kiyomizu-dera-3d ./dist/fudan-jiangwan-3d ./dist/fudan-handan-3d
          cp -r ./kiyomizu-dera-3d/dist/* ./dist/kiyomizu-dera-3d/
          cp -r ./fudan-jiangwan-3d/dist/* ./dist/fudan-jiangwan-3d/
          cp -r ./fudan-handan-3d/dist/* ./dist/fudan-handan-3d/
          cat > ./dist/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Code with AI for Fun — 3D 作品导航</title>
            <style>
              body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #11100e; color: #f2ece1; font-family: system-ui, sans-serif; }
              main { max-width: 680px; width: 90%; padding: 2rem; }
              h1 { font-weight: 600; letter-spacing: 0.06em; margin-bottom: 1.5rem; }
              a { display: block; padding: 1.1rem 1.3rem; margin-bottom: 0.9rem; border-radius: 8px; border: 1px solid rgba(242,236,225,0.18); background: rgba(255,255,255,0.04); color: #f2ece1; text-decoration: none; transition: border-color 0.2s; }
              a:hover { border-color: #d4a857; }
              span { display: block; font-size: 0.85rem; color: #aba293; margin-top: 0.3rem; }
            </style>
          </head>
          <body>
            <main>
              <h1>Code with AI for Fun · 3D 作品集</h1>
              <a href="./kiyomizu-dera-3d/">音羽山 清水寺 — Three.js 全境古建筑与地形数字复原<span>京都世界文化遗产全伽蓝 · 139 根榉木无钉悬造舞台 · 四季昼夜</span></a>
              <a href="./fudan-jiangwan-3d/">复旦大学（江湾校区）Three.js 三维数字孪生<span>1,600 亩新古典主义建筑群与日月湖水系</span></a>
              <a href="./fudan-handan-3d/">复旦大学（邯郸校区）Three.js 三维数字孪生<span>1,383 亩本部、北区、东区、南区全境漫游</span></a>
            </main>
          </body>
          </html>
          EOF

      - name: Check GitHub Pages configuration
        id: check_pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.check_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
