name: Build and Package 3D Projects

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.check_pages.outcome == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '*/*package-lock.json'

      - name: Build all subdirectory 3D projects and assemble Pages portal
        run: |
          mkdir -p ./dist
          for dir in */; do
            proj="${dir%/}"
            if [ -f "$proj/package.json" ]; then
              echo "=== Building $proj ==="
              (cd "$proj" && npm ci && npm run build)
              mkdir -p "./dist/$proj"
              cp -r "$proj/dist/"* "./dist/$proj/"
            fi
          done
          python3 - <<'PY'
          import glob, html, os, re

          cards = []
          for pkg in sorted(glob.glob('*/package.json')):
              proj = os.path.dirname(pkg)
              idx = os.path.join(proj, 'index.html')
              title = proj
              if os.path.exists(idx):
                  with open(idx, 'r', encoding='utf-8', errors='ignore') as f:
                      m = re.search(r'<title>(.*?)</title>', f.read(), re.I | re.S)
                      if m:
                          title = re.sub(r'\s+', ' ', m.group(1)).strip()
              cards.append(
                  f'<a class="card" href="./{html.escape(proj)}/">'
                  f'<span class="title">{html.escape(title)}</span>'
                  f'<span class="slug">/{html.escape(proj)}/</span>'
                  f'</a>'
              )

          page = f"""<!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Code with AI for Fun · Three.js 3D 作品集在线门户</title>
            <style>
              * {{ box-sizing: border-box; }}
              body {{ margin: 0; min-height: 100vh; display: flex; justify-content: center; align-items: center; background: radial-gradient(circle at top, #1d1a16 0%, #0d0c0a 100%); color: #f4efe6; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Serif SC", system-ui, sans-serif; padding: 2.5rem 1.25rem; }}
              main {{ max-width: 820px; width: 100%; }}
              header {{ margin-bottom: 2rem; border-bottom: 1px solid rgba(212, 168, 87, 0.28); padding-bottom: 1.25rem; }}
              h1 {{ font-size: 1.65rem; font-weight: 600; margin: 0 0 0.5rem; letter-spacing: 0.02em; }}
              p.sub {{ margin: 0; color: rgba(244, 239, 230, 0.68); font-size: 0.95rem; }}
              .grid {{ display: grid; gap: 0.85rem; }}
              a.card {{ display: flex; justify-content: space-between; align-items: center; gap: 1rem; padding: 1.1rem 1.35rem; border-radius: 10px; border: 1px solid rgba(244, 239, 230, 0.14); background: rgba(255, 255, 255, 0.035); color: #f4efe6; text-decoration: none; transition: transform 0.16s ease, border-color 0.16s ease, background 0.16s ease; }}
              a.card:hover {{ transform: translateY(-2px); border-color: #d4a857; background: rgba(212, 168, 87, 0.09); }}
              .title {{ font-weight: 500; font-size: 1.02rem; line-height: 1.45; }}
              .slug {{ font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.82rem; color: #d4a857; white-space: nowrap; }}
              footer {{ margin-top: 1.75rem; font-size: 0.85rem; color: rgba(244, 239, 230, 0.5); }}
              footer a {{ color: #d4a857; text-decoration: none; }}
            </style>
          </head>
          <body>
            <main>
              <header>
                <h1>Code with AI for Fun · Three.js 3D 在线作品集</h1>
                <p class="sub">点击任一项目即可直接在浏览器中进入三维场景漫游</p>
              </header>
              <div class="grid">{''.join(cards)}</div>
              <footer>源码与离线 ZIP 包归档：<a href="https://github.com/jingzhou-code/code-with-ai-for-fun">github.com/jingzhou-code/code-with-ai-for-fun</a></footer>
            </main>
          </body>
          </html>"""
          with open('./dist/index.html', 'w', encoding='utf-8') as out:
              out.write(page)
          PY

      - name: Upload combined dist bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-3d-projects-dist
          path: './dist'

      - name: Check GitHub Pages configuration
        id: check_pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.check_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
