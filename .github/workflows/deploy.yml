name: Build and Package 3D Projects

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_enabled: ${{ steps.check_pages.outcome == 'success' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: '*/*package-lock.json'

      - name: Build all subdirectory 3D projects and assemble bundle
        run: |
          mkdir -p ./dist
          LINKS=""
          for dir in */; do
            proj="${dir%/}"
            if [ -f "$proj/package.json" ]; then
              echo "=== Building $proj ==="
              (cd "$proj" && npm ci && npm run build)
              mkdir -p "./dist/$proj"
              cp -r "$proj/dist/"* "./dist/$proj/"
              LINKS="${LINKS}<a href=\"./${proj}/\">${proj}</a>"
            fi
          done
          cat > ./dist/index.html <<EOF
          <!DOCTYPE html>
          <html lang="zh-CN">
          <head>
            <meta charset="UTF-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1.0" />
            <title>Code with AI for Fun — 3D Projects</title>
            <style>
              body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #11100e; color: #f2ece1; font-family: system-ui, sans-serif; }
              main { max-width: 680px; width: 90%; padding: 2rem; }
              h1 { font-weight: 600; margin-bottom: 1.5rem; }
              a { display: block; padding: 1rem 1.25rem; margin-bottom: 0.75rem; border-radius: 8px; border: 1px solid rgba(242,236,225,0.18); background: rgba(255,255,255,0.04); color: #f2ece1; text-decoration: none; }
              a:hover { border-color: #d4a857; }
            </style>
          </head>
          <body><main><h1>Code with AI for Fun · 3D Projects</h1>${LINKS}</main></body>
          </html>
          EOF

      - name: Upload combined dist bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: all-3d-projects-dist
          path: './dist'

      - name: Check GitHub Pages configuration
        id: check_pages
        continue-on-error: true
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.check_pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
